<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card</title>

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <!-- Google Pixel / Monospace Style Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000;
      color: #fff;
    }

    /* Background Layer */
    #bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    #bg-video, #bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      filter: brightness(0.65);
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
      z-index: 2;
    }

    /* Snow Canvas Layer */
    #snow-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Landing Screen Overlay ("click me") */
    #click-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #click-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .click-title {
      font-family: 'VT323', monospace;
      font-size: 2.2rem;
      letter-spacing: 3px;
      color: #fff;
      text-transform: lowercase;
      margin-bottom: 10px;
    }

    .click-sub {
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 80px;
    }

    .click-hint {
      position: absolute;
      bottom: 40px;
      font-family: 'VT323', monospace;
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 1.5px;
    }

    /* Main Card Layout */
    .main-wrapper {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile-card {
      width: 100%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header Section (Name + Badges) */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-name {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      font-weight: 400;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1;
    }

    .badges-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .badge-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .badge-fa {
      font-size: 0.9rem;
      color: #8b9bb4;
    }

    .verified-icon {
      color: #5865f2;
      font-size: 0.95rem;
    }

    /* Bio Section */
    .profile-bio {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.3;
    }

    /* Links Section */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-left i {
      font-size: 0.9rem;
      width: 14px;
      text-align: center;
    }

    .link-arrow {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.35);
    }

    /* Touch / Click Ripple Effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple-animation 0.6s ease-out forwards;
      z-index: 9999;
    }

    @keyframes ripple-animation {
      to {
        transform: translate(-50%, -50%) scale(2.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bg-audio" loop></audio>

  <!-- Canvas for Falling Snow -->
  <canvas id="snow-canvas"></canvas>

  <!-- Background Media -->
  <div id="bg-container">
    <video id="bg-video" autoplay loop muted playsinline></video>
    <img id="bg-image" alt="Background" />
    <div class="bg-overlay"></div>
  </div>

  <!-- Entry Screen Overlay -->
  <div id="click-screen">
    <div class="click-title" id="overlay-title">click me</div>
    <div class="click-sub" id="overlay-sub">camel</div>
    <div class="click-hint">• TAP ANYWHERE</div>
  </div>

  <!-- Main Profile Card Container -->
  <div class="main-wrapper">
    <div class="profile-card">
      
      <!-- Name & Badges -->
      <div class="profile-header">
        <span class="profile-name" id="profile-name">camel</span>
        <div class="badges-container" id="badges-container"></div>
      </div>

      <!-- Bio -->
      <div class="profile-bio" id="profile-bio"></div>

      <!-- Social Links -->
      <div class="links-list" id="links-container"></div>

    </div>
  </div>

  <script>
    // Configuration Object
    const profileConfig = {
      name: "camel",
      verified: true,
      bio: "", // Optional bio text

      // Overlay Screen Text
      overlayTitle: "click me",
      overlaySub: "camel",

      // 1. BACKGROUND VIDEO OR PHOTO (Auto-detects video vs image)
      bgMediaUrl: "https://your-video-host.com/background.mp4", 

      // 2. BACKGROUND SONG DIRECT LINK
      musicUrl: "https://your-audio-host.com/track.mp3",

      // 3. BADGES (Supports FontAwesome icons OR image URLs)
      badges: [
        { name: "Discord", icon: "fa-brands fa-discord" },
        { name: "Verified", icon: "fa-solid fa-check-circle" },
        { name: "Custom Image", icon: "https://your-image-host.com/badge3.png" }
      ],

      // 4. SOCIAL LINKS
      links: [
        { title: "tg", url: "https://t.me/yourlink", icon: "fa-brands fa-telegram" },
        { title: "ig", url: "https://instagram.com/yourname", icon: "fa-brands fa-instagram" }
      ]
    };

    document.addEventListener("DOMContentLoaded", () => {
      // Set Name
      document.getElementById("profile-name").textContent = profileConfig.name;

      // Overlay text
      document.getElementById("overlay-title").textContent = profileConfig.overlayTitle || "click me";
      document.getElementById("overlay-sub").textContent = profileConfig.overlaySub || profileConfig.name;

      // Render Badges
      const badgesContainer = document.getElementById("badges-container");
      
      // Add Verified Badge if true
      if (profileConfig.verified) {
        const verifiedIcon = document.createElement("i");
        verifiedIcon.className = "fa-solid fa-circle-check verified-icon";
        verifiedIcon.title = "Verified";
        badgesContainer.appendChild(verifiedIcon);
      }

      // Add Badges dynamically
      if (Array.isArray(profileConfig.badges)) {
        profileConfig.badges.forEach(b => {
          if (!b.icon) return;

          const span = document.createElement("span");
          span.className = "badge-item";
          span.title = b.name || "";

          // Check if icon is an Image URL or FontAwesome Icon Class
          if (b.icon.startsWith("http://") || b.icon.startsWith("https://") || b.icon.startsWith("/")) {
            const img = document.createElement("img");
            img.src = b.icon;
            img.alt = b.name || "Badge";
            img.className = "badge-icon";
            span.appendChild(img);
          } else {
            const i = document.createElement("i");
            let iconClass = b.icon;
            if (!iconClass.includes("fa-")) iconClass = "fa-solid fa-" + iconClass;
            i.className = iconClass + " badge-fa";
            span.appendChild(i);
          }

          badgesContainer.appendChild(span);
        });
      }

      // Render Bio
      const bioEl = document.getElementById("profile-bio");
      if (profileConfig.bio && profileConfig.bio.trim() !== "") {
        bioEl.textContent = profileConfig.bio;
      } else {
        bioEl.style.display = "none";
      }

      // Render Social Links
      const linksContainer = document.getElementById("links-container");
      if (Array.isArray(profileConfig.links)) {
        profileConfig.links.forEach(link => {
          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.className = "link-item";

          let iconClass = link.icon;
          if (!iconClass.includes("fa-")) {
            iconClass = "fa-solid fa-" + iconClass;
          }

          a.innerHTML = `
            <div class="link-left">
              <i class="${iconClass}"></i>
              <span>.${link.title}</span>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
          `;
          linksContainer.appendChild(a);
        });
      }

      // Setup Background Media
      const bgVideo = document.getElementById("bg-video");
      const bgImage = document.getElementById("bg-image");
      const url = profileConfig.bgMediaUrl || "";

      if (url.match(/\.(mp4|webm|ogg|mov)$/i)) {
        bgVideo.src = url;
        bgVideo.style.display = "block";
      } else if (url !== "") {
        bgImage.src = url;
        bgImage.style.display = "block";
      }

      // Setup Audio
      const audio = document.getElementById("bg-audio");
      if (profileConfig.musicUrl) {
        audio.src = profileConfig.musicUrl;
      }

      // Click Overlay Screen Trigger
      const clickScreen = document.getElementById("click-screen");
      clickScreen.addEventListener("click", () => {
        clickScreen.classList.add("hidden");
        if (profileConfig.musicUrl) {
          audio.play().catch(err => console.log("Audio play error:", err));
        }
        if (bgVideo.src) {
          bgVideo.play().catch(err => console.log("Video play error:", err));
        }
      });
    });

    /* --- SMOOTH FALLING SNOW EFFECT --- */
    const canvas = document.getElementById("snow-canvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const flakes = Array.from({ length: 65 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 1.8 + 0.6,
      density: Math.random() * 1 + 0.5,
      opacity: Math.random() * 0.6 + 0.2,
    }));

    function renderSnow() {
      ctx.clearRect(0, 0, width, height);

      flakes.forEach(flake => {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
        ctx.fill();

        flake.y += flake.density * 0.8;
        flake.x += Math.sin(flake.y / 30) * 0.3;

        if (flake.y > height) {
          flake.y = -5;
          flake.x = Math.random() * width;
        }
      });

      requestAnimationFrame(renderSnow);
    }
    renderSnow();

    /* --- TOUCH / CLICK RIPPLE EFFECT --- */
    function createRipple(e) {
      const ripple = document.createElement("div");
      ripple.className = "ripple";
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      ripple.style.left = `${clientX}px`;
      ripple.style.top = `${clientY}px`;
      ripple.style.width = "35px";
      ripple.style.height = "35px";

      document.body.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 600);
    }

    window.addEventListener("click", createRipple);
    window.addEventListener("touchstart", createRipple, { passive: true });
  </script>
</body>
</html>
