<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card</title>

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <!-- Google Pixel/Monospace Style Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000;
      color: #fff;
    }

    /* Background Media Layer */
    #bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    #bg-video, #bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      filter: brightness(0.65);
    }

    /* Dark overlay/vignette */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);
      z-index: 2;
    }

    /* Landing Screen Overlay ("Click Me") */
    #click-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #click-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .click-title {
      font-family: 'VT323', monospace;
      font-size: 2.2rem;
      letter-spacing: 3px;
      color: #fff;
      text-transform: lowercase;
      margin-bottom: 10px;
    }

    .click-sub {
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 80px;
    }

    .click-hint {
      position: absolute;
      bottom: 40px;
      font-family: 'VT323', monospace;
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 1.5px;
    }

    /* Main Container */
    .main-wrapper {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Profile Card Styling */
    .profile-card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    /* Header Section (Name + Badges) */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-name {
      font-family: 'VT323', monospace;
      font-size: 1.8rem;
      font-weight: 400;
      color: #fff;
      letter-spacing: 1px;
    }

    .badges-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
    }

    .verified-icon {
      color: #3b82f6;
      font-size: 0.95rem;
    }

    /* Bio Section */
    .profile-bio {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.4;
    }

    /* Links Section */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-left i {
      font-size: 1rem;
    }

    .link-arrow {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bg-audio" loop></audio>

  <!-- Background Media -->
  <div id="bg-container">
    <video id="bg-video" autoplay loop muted playsinline></video>
    <img id="bg-image" alt="Background" />
    <div class="bg-overlay"></div>
  </div>

  <!-- Entry Screen Overlay -->
  <div id="click-screen">
    <div class="click-title" id="overlay-title">click me</div>
    <div class="click-sub" id="overlay-sub">camel</div>
    <div class="click-hint">• TAP ANYWHERE</div>
  </div>

  <!-- Profile Card Container -->
  <div class="main-wrapper">
    <div class="profile-card">
      
      <!-- Name & Badges -->
      <div class="profile-header">
        <span class="profile-name" id="profile-name">camel</span>
        <div class="badges-container" id="badges-container"></div>
      </div>

      <!-- Bio -->
      <div class="profile-bio" id="profile-bio"></div>

      <!-- Social Links -->
      <div class="links-list" id="links-container"></div>

    </div>
  </div>

  <script>
    // Config Object
    const profileConfig = {
      name: "camel",
      verified: true,
      bio: "Digital Nomad • Cyber Aesthetic",

      // Overlay Screen text
      overlayTitle: "click me",
      overlaySub: "camel",

      // 1. BACKGROUND VIDEO OR PHOTO (Auto-detects mp4/mov or image format)
      bgMediaUrl: "https://your-video-host.com/background.mp4", 

      // 2. BACKGROUND SONG
      musicUrl: "https://your-audio-host.com/track.mp3",
      trackTitle: "Song Name",
      artistName: "Artist",

      // 3. BADGES
      badges: [
        { name: "Badge 1", icon: "https://your-image-host.com/badge1.png" },
        { name: "Badge 2", icon: "https://your-image-host.com/badge2.png" }
      ],

      // 4. SOCIAL LINKS
      links: [
        { title: "tg", url: "https://t.me/yourlink", icon: "fa-paper-plane" },
        { title: "ig", url: "https://instagram.com/yourname", icon: "fa-brands fa-instagram" }
      ]
    };

    // Render Data to Page
    document.addEventListener("DOMContentLoaded", () => {
      // Set Name
      document.getElementById("profile-name").textContent = profileConfig.name;

      // Overlay text
      document.getElementById("overlay-title").textContent = profileConfig.overlayTitle || "click me";
      document.getElementById("overlay-sub").textContent = profileConfig.overlaySub || profileConfig.name;

      // Render Badges
      const badgesContainer = document.getElementById("badges-container");
      
      if (profileConfig.verified) {
        const verifiedIcon = document.createElement("i");
        verifiedIcon.className = "fa-solid fa-circle-check verified-icon";
        verifiedIcon.title = "Verified";
        badgesContainer.appendChild(verifiedIcon);
      }

      if (Array.isArray(profileConfig.badges)) {
        profileConfig.badges.forEach(b => {
          if (b.icon) {
            const img = document.createElement("img");
            img.src = b.icon;
            img.alt = b.name || "Badge";
            img.className = "badge-icon";
            badgesContainer.appendChild(img);
          }
        });
      }

      // Render Bio
      const bioEl = document.getElementById("profile-bio");
      if (profileConfig.bio) {
        bioEl.textContent = profileConfig.bio;
      } else {
        bioEl.style.display = "none";
      }

      // Render Links
      const linksContainer = document.getElementById("links-container");
      if (Array.isArray(profileConfig.links)) {
        profileConfig.links.forEach(link => {
          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.className = "link-item";

          // Icon class handler (defaults to brand or standard solid icon)
          let iconClass = link.icon;
          if (!iconClass.includes("fa-")) {
            iconClass = "fa-solid fa-" + iconClass;
          }

          a.innerHTML = `
            <div class="link-left">
              <i class="${iconClass}"></i>
              <span>.${link.title}</span>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
          `;
          linksContainer.appendChild(a);
        });
      }

      // Setup Background Media
      const bgVideo = document.getElementById("bg-video");
      const bgImage = document.getElementById("bg-image");
      const url = profileConfig.bgMediaUrl || "";

      if (url.match(/\.(mp4|webm|ogg|mov)$/i)) {
        bgVideo.src = url;
        bgVideo.style.display = "block";
      } else if (url !== "") {
        bgImage.src = url;
        bgImage.style.display = "block";
      }

      // Setup Audio
      const audio = document.getElementById("bg-audio");
      if (profileConfig.musicUrl) {
        audio.src = profileConfig.musicUrl;
      }

      // Click Screen Handler (Plays music & unlocks audio on user gesture)
      const clickScreen = document.getElementById("click-screen");
      clickScreen.addEventListener("click", () => {
        clickScreen.classList.add("hidden");
        if (profileConfig.musicUrl) {
          audio.play().catch(err => console.log("Audio play error:", err));
        }
        if (bgVideo.src) {
          bgVideo.play().catch(err => console.log("Video play error:", err));
        }
      });
    });
  </script>
</body>
</html>
